<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="kLetterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <filter id="kShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#kBgGrad)" />

  <!-- Subtle border outline -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.35" />

  <!-- Background Decorative Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Giant Bold Elegant "K" Symbol -->
  <g filter="url(#kShadow)">
    <!-- Vertical Pillar of K -->
    <rect x="140" y="116" width="60" height="280" rx="20" fill="url(#kLetterGrad)" />

    <!-- Upper Diagonal Arm of K -->
    <path d="M 180 260 L 320 126 C 330 116, 348 116, 358 126 L 366 134 C 376 144, 376 162, 366 172 L 244 290 Z" fill="url(#kLetterGrad)" />

    <!-- Lower Diagonal Leg of K with Gold accent tip -->
    <path d="M 215 260 L 340 376 C 350 386, 352 402, 342 412 L 332 422 C 322 432, 306 432, 296 422 L 175 310 Z" fill="url(#kLetterGrad)" />

    <!-- Golden Grain Accent Dot on top right of K -->
    <circle cx="348" cy="148" r="16" fill="url(#goldAcc)" />
  </g>
</svg>