name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android Platforms & Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Patch UI Lights, 1cm Margin & Real-time Connection
        run: |
          python3 - << 'PY'
          import os

          # 1. Patch Header.tsx: Only check real isBluetoothConnected() so light is RED when OFF and BLUE when ON
          if os.path.exists('src/components/Header.tsx'):
              with open('src/components/Header.tsx', 'r', encoding='utf-8') as f:
                  h = f.read()
              if 'isPrinterOnline' not in h:
                  h = h.replace("import { FirmSettings } from '../types';", "import { FirmSettings } from '../types';\nimport { isBluetoothConnected, subscribeBluetoothStatus } from '../utils/bluetoothPrinter';")
                  target_s = "const [isDrawerOpen, setIsDrawerOpen] = useState(false);"
                  new_s = target_s + """
            const [isPrinterOnline, setIsPrinterOnline] = useState<boolean>(() => isBluetoothConnected());
            useEffect(() => {
              const unsub = subscribeBluetoothStatus((connected) => {
                setIsPrinterOnline(connected);
              });
              const interval = setInterval(() => {
                setIsPrinterOnline(isBluetoothConnected());
              }, 1500);
              return () => { unsub(); clearInterval(interval); };
            }, []);
          """
                  h = h.replace(target_s, new_s)
                  act = '{/* Right: Actions - Calendar & New Bill Symbols */}\n          <div className="flex items-center gap-2">'
                  badge = act + """
                      <div className={`flex items-center justify-center w-8 h-8 rounded-full border transition-all ${isPrinterOnline ? 'bg-blue-50 border-blue-300 shadow-xs' : 'bg-rose-50 border-rose-300 shadow-xs'}`} title={isPrinterOnline ? 'પ્રિન્ટર કનેક્ટેડ છે' : 'પ્રિન્ટર કનેક્ટ નથી'}>
                        <span className="relative flex h-3.5 w-3.5">
                          {isPrinterOnline && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>}
                          <span className={`relative inline-flex rounded-full h-3.5 w-3.5 ${isPrinterOnline ? 'bg-blue-600 shadow-sm' : 'bg-rose-600 shadow-sm'}`}></span>
                        </span>
                      </div>
          """
                  h = h.replace(act, badge)
                  with open('src/components/Header.tsx', 'w', encoding='utf-8') as f:
                      f.write(h)
                  print("Patched Header.tsx for real-time Blue/Red light")

          # 2. Patch bluetoothPrinter.ts: Exact 1cm space (y += 24) + Real bridge.isConnected check
          if os.path.exists('src/utils/bluetoothPrinter.ts'):
              with open('src/utils/bluetoothPrinter.ts', 'r', encoding='utf-8') as f:
                  bp = f.read()
              bp = bp.replace("y += 40;", "y += 24;")
              old_is_bt = "export const isBluetoothConnected = (): boolean => {\n  return Boolean(activeGattServer && activeGattServer.connected);\n};"
              new_is_bt = """export const isBluetoothConnected = (): boolean => {
            if (typeof window !== 'undefined') {
              const bridge = (window as any).AndroidPrinter || (window as any).AndroidBridge || (window as any).Android;
              if (bridge && typeof bridge.isConnected === 'function') {
                try { return Boolean(bridge.isConnected()); } catch { return false; }
              }
            }
            return Boolean(activeGattServer && activeGattServer.connected);
          };"""
              if old_is_bt in bp:
                  bp = bp.replace(old_is_bt, new_is_bt)
              with open('src/utils/bluetoothPrinter.ts', 'w', encoding='utf-8') as f:
                  f.write(bp)
              print("Patched bluetoothPrinter.ts for 1cm space and live bridge status")
          PY

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: |
          npm run build

      - name: Install Capacitor
        run: |
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android @capacitor/app --legacy-peer-deps

      - name: Initialize Capacitor Config
        run: |
          cat << 'CONF' > capacitor.config.json
          {
            "appId": "com.kaleshwari.kharidvoucher",
            "appName": "Kharid Voucher",
            "webDir": "dist"
          }
          CONF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Configure Native Android Bluetooth & Mic Bridge
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\\n    <uses-permission android:name="android.permission.BLUETOOTH" />\\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

          cat << 'JAVA' > android/app/src/main/java/com/kaleshwari/kharidvoucher/AndroidPrinterBridge.java
          package com.kaleshwari.kharidvoucher;

          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import android.util.Log;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.util.Set;
          import java.util.UUID;

          public class AndroidPrinterBridge {
              private static final String TAG = "AndroidPrinterBridge";
              private static final UUID SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
              private final Context context;
              private static final Object PRINT_LOCK = new Object();

              // Persistent Socket & Stream: connects once, stays connected
              private static BluetoothSocket sSocket = null;
              private static OutputStream sOut = null;

              public AndroidPrinterBridge(Context context) {
                  this.context = context;
              }

              @JavascriptInterface
              public boolean isConnected() {
                  synchronized (PRINT_LOCK) {
                      try {
                          if (sSocket != null && sSocket.isConnected() && sOut != null) {
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }
              }

              @JavascriptInterface
              public boolean hasPairedPrinter() {
                  try {
                      BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                      if (adapter == null || !adapter.isEnabled()) return false;
                      Set<BluetoothDevice> pairedDevices = adapter.getBondedDevices();
                      for (BluetoothDevice device : pairedDevices) {
                          String name = device.getName() != null ? device.getName().toUpperCase() : "";
                          if (name.contains("PSF588") || name.contains("PRINTER") || name.contains("POS") || name.contains("RPP") || name.contains("MPT")) {
                              return true;
                          }
                      }
                  } catch (Exception ignored) {}
                  return false;
              }

              @JavascriptInterface
              public boolean connect() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          synchronized (PRINT_LOCK) {
                              ensureSocketConnected(true);
                          }
                      }
                  }).start();
                  return true;
              }

              private boolean ensureSocketConnected(boolean showToast) {
                  try {
                      if (sSocket != null && sSocket.isConnected() && sOut != null) {
                          if (showToast) showToast("✅ PSF588 પ્રિન્ટર જોડાયેલું છે!");
                          return true;
                      }
                  } catch (Exception ignored) {}

                  closeSocketQuietly();

                  try {
                      BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                      if (adapter == null || !adapter.isEnabled()) {
                          if (showToast) showToast("કૃપા કરીને બ્લૂટૂથ ચાલુ કરો");
                          return false;
                      }

                      Set<BluetoothDevice> pairedDevices = adapter.getBondedDevices();
                      BluetoothDevice target = null;

                      for (BluetoothDevice dev : pairedDevices) {
                          if (dev.getName() != null && dev.getName().toUpperCase().contains("PSF588")) {
                              target = dev;
                              break;
                          }
                      }

                      if (target == null) {
                          for (BluetoothDevice dev : pairedDevices) {
                              String n = dev.getName() != null ? dev.getName().toUpperCase() : "";
                              if (n.contains("PRINTER") || n.contains("POS") || n.contains("RPP") || n.contains("MPT")) {
                                  target = dev;
                                  break;
                              }
                          }
                      }

                      if (target == null && !pairedDevices.isEmpty()) {
                          target = pairedDevices.iterator().next();
                      }

                      if (target == null) {
                          if (showToast) showToast("મોબાઇલ બ્લૂટૂથ સેટિંગ્સમાંથી PSF588 પેર કરો");
                          return false;
                      }

                      if (adapter.isDiscovering()) {
                          adapter.cancelDiscovery();
                      }

                      sSocket = target.createRfcommSocketToServiceRecord(SPP_UUID);
                      sSocket.connect();
                      sOut = sSocket.getOutputStream();
                      if (showToast) showToast("✅ PSF588 પ્રિન્ટર કનેક્ટ થઈ ગયું!");
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "Connection failed", e);
                      closeSocketQuietly();
                      if (showToast) showToast("PSF588 કનેક્ટ થઈ શક્યું નહીં. પ્રિન્ટર ચાલુ છે?");
                      return false;
                  }
              }

              private void closeSocketQuietly() {
                  try {
                      if (sOut != null) sOut.close();
                  } catch (Exception ignored) {}
                  try {
                      if (sSocket != null) sSocket.close();
                  } catch (Exception ignored) {}
                  sOut = null;
                  sSocket = null;
              }

              @JavascriptInterface
              public void print(final String base64Png) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          synchronized (PRINT_LOCK) {
                              printInternal(base64Png, false);
                          }
                      }
                  }).start();
              }

              private void printInternal(String base64Png, boolean isRetry) {
                  try {
                      if (!ensureSocketConnected(!isRetry)) {
                          return;
                      }

                      byte[] decoded = Base64.decode(base64Png, Base64.DEFAULT);
                      Bitmap bitmap = BitmapFactory.decodeByteArray(decoded, 0, decoded.length);
                      if (bitmap == null) return;

                      // 1. Hardware Clear & Reset: ESC @ resets printer RAM to prevent corrupted characters on Bill 2, 3...
                      sOut.write(new byte[]{0x1B, 0x40});
                      Thread.sleep(40);

                      // 2. Alignment Center: ESC a 1
                      sOut.write(new byte[]{0x1B, 0x61, 0x01});
                      sOut.flush();

                      // 3. Raster Data Stream
                      byte[] raster = bitmapToEscPosRaster(bitmap);

                      int PREROLL_BYTES = Math.min(raster.length, 1152);
                      if (PREROLL_BYTES > 0) {
                          outWriteSafe(raster, 0, PREROLL_BYTES);
                      }

                      int BATCH_BYTES = 384;
                      for (int offset = PREROLL_BYTES; offset < raster.length; offset += BATCH_BYTES) {
                          int len = Math.min(BATCH_BYTES, raster.length - offset);
                          outWriteSafe(raster, offset, len);
                          Thread.sleep(7);
                      }

                      // 4. Exact 1 cm Bottom Space: Feed 1 line + LF (ESC d 1)
                      sOut.write(new byte[]{0x1B, 0x64, 0x01, 0x0A});
                      sOut.flush();

                      showToast("પ્રિન્ટ સફળ!");

                  } catch (Exception e) {
                      Log.e(TAG, "Print error, retrying with fresh socket...", e);
                      closeSocketQuietly();
                      if (!isRetry) {
                          try {
                              Thread.sleep(300);
                          } catch (Exception ignored) {}
                          printInternal(base64Png, true);
                      } else {
                          showToast("પ્રિન્ટરમાં એરર: " + e.getMessage());
                      }
                  }
              }

              private void outWriteSafe(byte[] data, int off, int len) throws Exception {
                  if (sOut != null) {
                      sOut.write(data, off, len);
                      sOut.flush();
                  }
              }

              private byte[] bitmapToEscPosRaster(Bitmap bitmap) {
                  int width = bitmap.getWidth();
                  int height = bitmap.getHeight();
                  int widthBytes = (width + 7) / 8;

                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                  baos.write(0x1D);
                  baos.write(0x76);
                  baos.write(0x30);
                  baos.write(0x00);
                  baos.write(widthBytes & 0xFF);
                  baos.write((widthBytes >> 8) & 0xFF);
                  baos.write(height & 0xFF);
                  baos.write((height >> 8) & 0xFF);

                  for (int y = 0; y < height; y++) {
                      for (int x = 0; x < widthBytes; x++) {
                          byte b = 0;
                          for (int bit = 0; bit < 8; bit++) {
                              int px = (x * 8) + bit;
                              if (px < width) {
                                  int pixel = bitmap.getPixel(px, y);
                                  int r = (pixel >> 16) & 0xFF;
                                  int g = (pixel >> 8) & 0xFF;
                                  int bl = pixel & 0xFF;
                                  int luminance = (r * 299 + g * 587 + bl * 114) / 1000;
                                  if (luminance < 160) {
                                      b |= (1 << (7 - bit));
                                  }
                              }
                          }
                          baos.write(b);
                      }
                  }
                  return baos.toByteArray();
              }

              private void showToast(final String msg) {
                  if (context == null) return;
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(context, msg, Toast.LENGTH_SHORT).show();
                      }
                  });
              }
          }
          JAVA

          cat << 'JAVA' > android/app/src/main/java/com/kaleshwari/kharidvoucher/MainActivity.java
          package com.kaleshwari.kharidvoucher;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int PERMISSION_REQ_CODE = 101;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      String[] permissions = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.BLUETOOTH_SCAN,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
                  } else {
                      String[] permissions = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new AndroidPrinterBridge(this), "AndroidPrinter");
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              MainActivity.this.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      request.grant(request.getResources());
                                  }
                              });
                          }
                      });
                  }
              }
          }
          JAVA

      - name: Sync Web Assets to Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: kharid-voucher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
