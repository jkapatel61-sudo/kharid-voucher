name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: |
          npm run build

      - name: Setup Capacitor and Android
        run: |
          npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
          npx cap init "ખરીદ વાઉચર" "com.kaleshwari.kharidvoucher" --web-dir dist
          npx cap add android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharid-voucher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
