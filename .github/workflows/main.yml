name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Sync Latest 100% Complete App Code from Cloud
        run: |
          python3 - << 'PY'
          import urllib.request, json, base64, io, zipfile

          api_key = 'AIzaSyAr9YCCPyqytGEJpTbRMkXP3ZhlzNFEoFw'
          url = f'https://firestore.googleapis.com/v1/projects/project-0a6ddba0-f718-4110-bbc/databases/ai-studio-8ad813d1-adda-495e-806a-3743d9a3a0fe/documents/mandi_app_code/latest?key={api_key}'
          try:
              print("Downloading 100% latest complete production codebase...")
              with urllib.request.urlopen(url) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  b64 = data['fields']['code_zip_b64']['stringValue']
                  zip_bytes = base64.b64decode(b64)
                  with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
                      zf.extractall('.')
              print("SUCCESS: All 57 files updated with latest code!")
          except Exception as e:
              print("Notice: Proceeding with existing files:", e)
          PY

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android Platforms & Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli
          npm install --save-dev @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps

      - name: Ensure Capacitor Configuration
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kaleshwari.kharidvoucher",
            "appName": "શ્રી કલેશ્વરી કૃપા",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF
          fi

      - name: Build Web Production Bundle
        run: |
          npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx --package=@capacitor/cli cap add android
          fi

      - name: Configure Native Android Bluetooth, Audio & App Permissions
        run: |
          # 1. Update AndroidManifest.xml with proper runtime permissions using Python for 100% precision
          python3 - << 'PY'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.bluetooth" android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          """

          # Insert permissions before <application> if not already present
          if "android.permission.BLUETOOTH_CONNECT" not in content:
              content = content.replace("<application", permissions + "\n    <application")

          # Ensure cleartext and hardware acceleration
          if 'android:usesCleartextTraffic="true"' not in content:
              content = content.replace("<application", '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"')

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml successfully configured!")
          PY

          # 2. Set Status Bar Theme Color to Emerald (#047857) to seamlessly blend Camera Notch & Status Bar
          python3 - << 'PY'
          import os

          styles_path = "android/app/src/main/res/values/styles.xml"
          if os.path.exists(styles_path):
              with open(styles_path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "statusBarColor" not in content:
                  content = content.replace("</style>", '    <item name="android:statusBarColor">#047857</item>\n        <item name="android:windowLightStatusBar">false</item>\n    </style>')
                  with open(styles_path, "w", encoding="utf-8") as f:
                      f.write(content)
              print("styles.xml status bar color updated to Emerald 700!")
          PY

          # 3. Create High-Speed AndroidPrinterBridge
          mkdir -p android/app/src/main/java/com/kaleshwari/kharidvoucher
          cat << 'JAVA' > android/app/src/main/java/com/kaleshwari/kharidvoucher/AndroidPrinterBridge.java
          package com.kaleshwari.kharidvoucher;

          import android.Manifest;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Build;
          import android.util.Base64;
          import android.util.Log;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.lang.reflect.Method;
          import java.util.Set;
          import java.util.UUID;

          public class AndroidPrinterBridge {
              private static final String TAG = "AndroidPrinterBridge";
              private static final UUID SPP_UUID = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
              private final Context context;
              private static final Object PRINT_LOCK = new Object();
              private String preferredPrinterName = "PSF588";

              public AndroidPrinterBridge(Context context) {
                  this.context = context;
              }

              @JavascriptInterface
              public void setPreferredPrinterName(String name) {
                  if (name != null && !name.trim().isEmpty()) {
                      this.preferredPrinterName = name.trim();
                  }
              }

              private BluetoothSocket activeSocket = null;
              private OutputStream activeOut = null;

              @JavascriptInterface
              public boolean isConnected() {
                  try {
                      if (activeSocket != null && activeSocket.isConnected()) {
                          return true;
                      }
                  } catch (Exception ignored) {}
                  return false;
              }

              @JavascriptInterface
              public boolean hasPairedPrinter() {
                  try {
                      BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                      if (adapter == null || !adapter.isEnabled()) return false;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          if (ContextCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                              return false;
                          }
                      }

                      Set<BluetoothDevice> pairedDevices = adapter.getBondedDevices();
                      if (pairedDevices == null || pairedDevices.isEmpty()) return false;
                      for (BluetoothDevice device : pairedDevices) {
                          String name = device.getName() != null ? device.getName().toUpperCase() : "";
                          if ((!preferredPrinterName.isEmpty() && name.contains(preferredPrinterName.toUpperCase()))
                              || name.contains("PSF") || name.contains("PRINTER") || name.contains("POS")
                              || name.contains("RPP") || name.contains("MPT") || name.contains("MTP")
                              || name.contains("ESC") || name.contains("58") || name.contains("80")
                              || name.contains("BLUETOOTH")) {
                              return true;
                          }
                      }
                      return !pairedDevices.isEmpty();
                  } catch (Exception e) {
                      return false;
                  }
              }

              @JavascriptInterface
              public void connect() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          tryConnectPrinter(true);
                      }
                  }).start();
              }

              private synchronized boolean tryConnectPrinter(boolean showToast) {
                  try {
                      if (activeSocket != null && activeSocket.isConnected()) {
                          if (showToast) showToast("પ્રિન્ટર તૈયાર છે!");
                          notifyWebStatus(true);
                          return true;
                      }

                      BluetoothAdapter adapter = BluetoothAdapter.getDefaultAdapter();
                      if (adapter == null) {
                          if (showToast) showToast("આ ડિવાઇસમાં બ્લૂટૂથ સપોર્ટ નથી");
                          notifyWebStatus(false);
                          return false;
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          if (ContextCompat.checkSelfPermission(context, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                              if (context instanceof android.app.Activity) {
                                  ActivityCompat.requestPermissions((android.app.Activity) context, new String[]{
                                      Manifest.permission.BLUETOOTH_CONNECT,
                                      Manifest.permission.BLUETOOTH_SCAN
                                  }, 102);
                                  if (showToast) showToast("કૃપા કરીને બ્લૂટૂથ પરમિશન Allow (મંજૂર) કરો");
                                  notifyWebStatus(false);
                                  return false;
                              }
                          }
                      }

                      if (!adapter.isEnabled()) {
                          if (showToast) showToast("કૃપા કરીને ફોનનું Bluetooth ચાલુ કરો");
                          notifyWebStatus(false);
                          return false;
                      }

                      Set<BluetoothDevice> pairedDevices = adapter.getBondedDevices();
                      BluetoothDevice printerDevice = null;
                      if (pairedDevices != null) {
                          for (BluetoothDevice device : pairedDevices) {
                              String name = device.getName() != null ? device.getName().toUpperCase() : "";
                              if (!preferredPrinterName.isEmpty() && name.contains(preferredPrinterName.toUpperCase())) {
                                  printerDevice = device;
                                  break;
                              }
                          }
                          if (printerDevice == null) {
                              for (BluetoothDevice device : pairedDevices) {
                                  String name = device.getName() != null ? device.getName().toUpperCase() : "";
                                  if (name.contains("PSF") || name.contains("PRINTER") || name.contains("POS") || name.contains("RPP") || name.contains("MPT")) {
                                      printerDevice = device;
                                      break;
                                  }
                              }
                          }
                          if (printerDevice == null && !pairedDevices.isEmpty()) {
                              printerDevice = pairedDevices.iterator().next();
                          }
                      }

                      if (printerDevice == null) {
                          if (showToast) showToast("પ્રિન્ટર Pair કરેલું નથી. બ્લૂટૂથ સેટિંગ્સમાંથી " + preferredPrinterName + " Pair કરો");
                          notifyWebStatus(false);
                          return false;
                      }

                      if (adapter.isDiscovering()) {
                          adapter.cancelDiscovery();
                      }

                      BluetoothSocket socket = null;
                      try {
                          socket = printerDevice.createRfcommSocketToServiceRecord(SPP_UUID);
                          socket.connect();
                      } catch (Exception e1) {
                          try {
                              Method m = printerDevice.getClass().getMethod("createRfcommSocket", new Class[] {int.class});
                              socket = (BluetoothSocket) m.invoke(printerDevice, 1);
                              socket.connect();
                          } catch (Exception e2) {
                              throw e1;
                          }
                      }

                      activeSocket = socket;
                      activeOut = socket.getOutputStream();
                      notifyWebStatus(true);
                      if (showToast) showToast("પ્રિન્ટર જોડાયું!");
                      return true;
                  } catch (Exception e) {
                      closeSocket();
                      notifyWebStatus(false);
                      if (showToast) showToast("પ્રિન્ટર કનેક્ટ થયું નથી. પ્રિન્ટર ચાલુ છે કે નહિ તે તપાસો.");
                      return false;
                  }
              }

              private void notifyWebStatus(final boolean connected) {
                  if (context instanceof android.app.Activity) {
                      ((android.app.Activity) context).runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (context instanceof com.getcapacitor.BridgeActivity) {
                                      com.getcapacitor.BridgeActivity ba = (com.getcapacitor.BridgeActivity) context;
                                      if (ba.getBridge() != null && ba.getBridge().getWebView() != null) {
                                          ba.getBridge().getWebView().evaluateJavascript(
                                              "window.dispatchEvent(new CustomEvent('printerConnectionChanged', { detail: { connected: " + connected + " } }));", null
                                          );
                                      }
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }
              }

              private void closeSocket() {
                  try {
                      if (activeOut != null) {
                          activeOut.flush();
                          activeOut.close();
                      }
                  } catch (Exception ignored) {}
                  try {
                      if (activeSocket != null) {
                          activeSocket.close();
                      }
                  } catch (Exception ignored) {}
                  activeOut = null;
                  activeSocket = null;
              }

              @JavascriptInterface
              public void openBluetoothSettings() {
                  try {
                      android.content.Intent intent = new android.content.Intent(android.provider.Settings.ACTION_BLUETOOTH_SETTINGS);
                      intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                  } catch (Exception e) {
                      Log.e(TAG, "Cannot open BT settings: " + e.getMessage());
                  }
              }

              @JavascriptInterface
              public void print(final String base64Png) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          synchronized (PRINT_LOCK) {
                              printInternal(base64Png);
                          }
                      }
                  }).start();
              }

              @JavascriptInterface
              public String printSync(final String base64Png) {
                  synchronized (PRINT_LOCK) {
                      return printInternal(base64Png);
                  }
              }

              private String printInternal(String base64Png) {
                  try {
                      if (!tryConnectPrinter(false)) {
                          showToast("પ્રિન્ટર બંધ છે અથવા કનેક્ટ નથી.");
                          return "ERROR: પ્રિન્ટર બંધ છે અથવા કનેક્ટ નથી.";
                      }

                      byte[] decoded = Base64.decode(base64Png, Base64.DEFAULT);
                      Bitmap bitmap = BitmapFactory.decodeByteArray(decoded, 0, decoded.length);
                      if (bitmap == null) return "ERROR: Invalid image";

                      OutputStream out = activeOut;
                      if (out == null) return "ERROR: Stream not available";

                      Thread.sleep(60);

                      // 1. Non-destructive Buffer Clear: CAN (0x18) clears buffer without resetting registers
                      out.write(new byte[]{0x18});
                      out.write(new byte[]{0x1B, 0x61, 0x01}); // Center align
                      out.flush();
                      Thread.sleep(10);

                      // 2. Exact same single GS v 0 raster generation as Web Bill
                      int width = bitmap.getWidth();
                      int height = bitmap.getHeight();
                      int widthBytes = (width + 7) / 8;

                      byte[] header = new byte[]{
                          0x1D, 0x76, 0x30, 0x00,
                          (byte)(widthBytes & 0xFF),
                          (byte)((widthBytes >> 8) & 0xFF),
                          (byte)(height & 0xFF),
                          (byte)((height >> 8) & 0xFF)
                      };
                      out.write(header);
                      out.flush();
                      Thread.sleep(8);

                      // Convert bitmap to single continuous raster byte array with threshold 170
                      byte[] raster = new byte[widthBytes * height];
                      int offset = 0;
                      for (int y = 0; y < height; y++) {
                          for (int x = 0; x < widthBytes; x++) {
                              byte b = 0;
                              for (int bit = 0; bit < 8; bit++) {
                                  int px = (x * 8) + bit;
                                  if (px < width) {
                                      int pixel = bitmap.getPixel(px, y);
                                      int r = (pixel >> 16) & 0xFF;
                                      int g = (pixel >> 8) & 0xFF;
                                      int bl = pixel & 0xFF;
                                      int lum = (r * 299 + g * 587 + bl * 114) / 1000;
                                      if (lum < 170) {
                                          b |= (1 << (7 - bit));
                                      }
                                  }
                              }
                              raster[offset++] = b;
                          }
                      }

                      // 3. Exact same speed & memory settings as Web Bill:
                      // PREROLL_BYTES 1152 with 0ms delay to fill FIFO buffer
                      int PREROLL_BYTES = Math.min(raster.length, 1152);
                      if (PREROLL_BYTES > 0) {
                          out.write(raster, 0, PREROLL_BYTES);
                          out.flush();
                      }

                      // Continuous stream in 384-byte chunks with 7ms pacing
                      int BATCH_BYTES = 384;
                      for (int i = PREROLL_BYTES; i < raster.length; i += BATCH_BYTES) {
                          int len = Math.min(BATCH_BYTES, raster.length - i);
                          out.write(raster, i, len);
                          out.flush();
                          Thread.sleep(7);
                      }

                      // 4. Standard clean finish line feed (2 lines) - no extra 1.5 cm waste
                      out.write(new byte[]{0x0A, 0x0A});
                      out.flush();

                      Thread.sleep(300);
                      showToast("પ્રિન્ટ સફળ!");
                      return "OK";
                  } catch (Exception e) {
                      Log.e(TAG, "Print error: " + e.getMessage());
                      closeSocket();
                      notifyWebStatus(false);
                      showToast("પ્રિન્ટરમાં એરર: " + (e.getMessage() != null ? e.getMessage() : "કનેક્શન નિષ્ફળ"));
                      return "ERROR: " + e.getMessage();
                  }
              }

              private void showToast(final String msg) {
                  if (context == null) return;
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(context, msg, Toast.LENGTH_SHORT).show();
                      }
                  });
              }
          }
          JAVA

          # 4. Update MainActivity.java (Automatic runtime permission prompt & bridge registration)
          cat << 'JAVA' > android/app/src/main/java/com/kaleshwari/kharidvoucher/MainActivity.java
          package com.kaleshwari.kharidvoucher;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int PERMISSION_REQ_CODE = 101;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestAppPermissions();
                  setupWebViewBridge();
              }

              private void requestAppPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      String[] permissions = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.BLUETOOTH_CONNECT,
                          Manifest.permission.BLUETOOTH_SCAN,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
                  } else {
                      String[] permissions = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      ActivityCompat.requestPermissions(this, permissions, PERMISSION_REQ_CODE);
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  setupWebViewBridge();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  setupWebViewBridge();
              }

              private void setupWebViewBridge() {
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new AndroidPrinterBridge(this), "AndroidPrinter");
                      try {
                          this.bridge.getWebView().setWebChromeClient(new com.getcapacitor.BridgeWebChromeClient(this.bridge) {
                              @Override
                              public void onPermissionRequest(final PermissionRequest request) {
                                  request.grant(request.getResources());
                              }
                          });
                      } catch (Exception ignored) {}
                  }
              }
          }
          JAVA

      - name: Sync Web Assets to Android
        run: |
          npx --package=@capacitor/cli cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Named APK Files
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/KharidVoucher.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/KharidVoucher-v1.0.apk

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: KharidVoucher-APK
          path: output_apk/KharidVoucher.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK Download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Kharid Voucher Mobile APK v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### 📱 શ્રી કલેશ્વરી કૃપા - ખરીદ વાઉચર Android APK
            - **ફાઇલ:** `KharidVoucher.apk`
            - **ઝડપી થર્મલ પ્રિન્ટ:** PSF588 અને અન્ય Bluetooth પ્રિન્ટર માટે હાઈ-સ્પીડ ESC/POS રિયલ-ટાઇમ પ્રિન્ટ
            - **કેમેરા નોચ ફિક્સ:** મોબાઇલ કેમેરા પંચ-હોલ નીચે સેફ-એરિયા ઇનસેટ ફિક્સ
            - **ઓટો-પરમિશન:** બ્લૂટૂથ અને માઇક્રોફોન પરમિશન
          files: |
            output_apk/KharidVoucher.apk
            output_apk/KharidVoucher-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
